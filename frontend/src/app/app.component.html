<router-outlet></router-outlet>

<div class="toast-stack" aria-live="polite">
  @for (toast of notifier.toasts(); track toast.id) {
    <div class="toast" [class.toast-info]="toast.kind === 'info'" [attr.role]="toast.kind === 'info' ? 'status' : 'alert'">
      <div class="toast-body">
        <strong>{{ toast.message }}</strong>
        @if (toast.details.length) {
          <ul>
            @for (d of toast.details; track d) { <li>{{ d }}</li> }
          </ul>
        }
      </div>
      <button type="button" class="toast-close icon-btn icon-btn-sm" aria-label="Dismiss" (click)="notifier.dismiss(toast.id)"><sf-icon name="x" [size]="14"></sf-icon></button>
    </div>
  }
</div>
