<div class="login-container">
  <div class="ambient-glow"></div>

  <div class="login-card">
    <!-- Brand & Logo -->
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#006022" />
          <path d="M12 20C12 15.5817 15.5817 12 20 12C24.4183 12 28 15.5817 28 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
          <path d="M28 20C28 24.4183 24.4183 28 20 28C15.5817 28 12 24.4183 12 20" stroke="#C59B27" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="20" cy="20" r="3" fill="#FFFFFF" />
        </svg>
      </div>
      <h2>SyncFlow</h2>
      <p class="tagline">Sign in to your enterprise workspace</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="alert-box">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label for="email">Work Email</label>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@syncflow.bank"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </div>
        <span *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          Enter a valid work email address
        </span>
      </div>

      <div class="form-field">
        <div class="field-header">
          <label for="password">Password</label>
        </div>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••••••"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
        </div>
        <span *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          Password must be at least 6 characters
        </span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()" class="loading-state">
          <span class="spinner"></span> Signing in...
        </span>
      </button>
    </form>

    <!-- Quick Role Autofill -->
    <div class="quick-access">
      <span class="quick-label">Demo Access</span>
      <div class="role-pills">
        <button
          *ngFor="let role of demoRoles"
          type="button"
          class="role-pill"
          (click)="fillRole(role)"
        >
          {{ role.label }}
        </button>
      </div>
    </div>
  </div>
</div>
