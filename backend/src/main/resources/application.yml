server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /api
  # Set to "native" behind a trusted reverse proxy so client IPs (audit log) come from X-Forwarded-For
  forward-headers-strategy: ${SYNCFLOW_FORWARD_HEADERS:none}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: syncflow-api

  # Optional, git-ignored local overrides (secrets for development). See config/application-local.example.yml
  config:
    import: optional:file:./config/application-local.yml

  # Java 21 Project Loom Virtual Threads Enabled
  threads:
    virtual:
      enabled: true

  # Database Connection - Microsoft SQL Server. Credentials come from the environment.
  datasource:
    url: ${SYNCFLOW_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=syncflow_db;encrypt=true;trustServerCertificate=true;}
    username: ${SYNCFLOW_DB_USERNAME:syncflow_user}
    password: ${SYNCFLOW_DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  # Schema is owned by Flyway migrations; Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  # Caffeine In-Memory Cache
  cache:
    type: caffeine
    cache-names:
      - active_projects
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

# SyncFlow Custom Configurations
syncflow:
  jwt:
    # Base64-encoded key of at least 32 bytes. Required; generate with: openssl rand -base64 48
    secret: ${SYNCFLOW_JWT_SECRET:}
    access-expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000    # 7 days
    elevation-expiration-ms: 300000     # 5 minutes
  cors:
    allowed-origins: ${SYNCFLOW_CORS_ORIGINS:http://localhost:4200,http://localhost:8100,capacitor://localhost}
  storage:
    attachments-dir: ${SYNCFLOW_ATTACHMENTS_DIR:./data/attachments}
  webhooks:
    allow-private-targets: ${SYNCFLOW_WEBHOOKS_ALLOW_PRIVATE:false}
    connect-timeout-ms: 5000
    request-timeout-ms: 10000
    max-attempts: 3
  finance:
    default-hourly-rate: 85.0
    role-hourly-rates:
      ADMIN: 120.0
      REPORTING_MANAGER: 130.0
      TEAM_LEAD: 110.0
      DEVELOPER: 85.0
      SQA: 75.0
  capacity:
    default-story-points-per-member: 15
  bootstrap:
    admin-email: ${SYNCFLOW_ADMIN_EMAIL:}
    admin-password: ${SYNCFLOW_ADMIN_PASSWORD:}
  security:
    max-failed-login-attempts: 5
    lockout-minutes: 15
